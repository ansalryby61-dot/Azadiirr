<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة أزادير - النظام السحابي الفوري</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #16a085;
            --accent-color: #e74c3c;
            --edit-color: #f39c12;
            --share-color: #4db6ac; 
            --bg-color: #f8f9fa;
            --text-color: #333;
            --light-blue-btn: #3498db;
            --light-blue-bg: #eaf2f8;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* تنسيق الهيدر والشعار المطور من صورة 1000283088.jpg */
        header { text-align: center; margin-bottom: 20px; border-bottom: 3px solid var(--secondary-color); padding-bottom: 15px; }
        .header-title-wrap { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
        header h1 { color: var(--primary-color); margin: 0; font-size: 28px; display: flex; align-items: center; gap: 12px; }
        .logo-svg { width: 65px; height: auto; }
        
        .sync-box { background: var(--light-blue-bg); border: 2px solid #a9ccee; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
        .sync-title { font-weight: bold; color: var(--primary-color); margin-bottom: 10px; font-size: 15px; }
        .sync-btn { width: 100%; padding: 14px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .sync-btn:active { transform: scale(0.98); }
        .btn-share { background-color: var(--light-blue-btn); box-shadow: 0 3px 6px rgba(52, 152, 219, 0.3); }
        
        .main-categories { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 25px; }
        .cat-btn { padding: 12px 5px; border: 2px solid var(--primary-color); background: white; color: var(--primary-color); font-weight: bold; font-size: 14px; cursor: pointer; border-radius: 8px; text-align: center; }
        .cat-btn.active { background: var(--primary-color); color: white; }
        
        .action-tabs { display: none; background: #eee; border-radius: 6px; padding: 4px; margin-bottom: 20px; }
        .action-btn { flex: 1; padding: 10px; border: none; background: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .action-btn.active { background: var(--secondary-color); color: white; }
        
        .view-section, .form-section { display: none; }
        .view-section.active, .form-section.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button.btn { background-color: var(--secondary-color); color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: right; }
        th { background-color: var(--primary-color); color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .admin-actions { display: none; }
        .action-cell { display: flex; gap: 5px; justify-content: flex-start; }
        .opt-btn { border: none; padding: 6px 10px; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-edit-item { background-color: var(--edit-color); }
        .btn-del-item { background-color: var(--accent-color); }
        
        .alert { padding: 12px; background-color: #2ecc71; color: white; border-radius: 6px; margin-bottom: 15px; display: none; text-align: center; font-weight: bold; }
        .current-cat-title { color: var(--secondary-color); margin-top: 0; border-right: 4px solid var(--secondary-color); padding-right: 8px; }
        
        .admin-lock-zone { margin-top: 30px; text-align: center; padding-top: 15px; border-top: 1px solid #eee; }
        .lock-link { color: #7f8c8d; font-size: 13px; text-decoration: none; cursor: pointer; font-weight: bold; }
        .lock-link:hover { color: var(--accent-color); }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="header-title-wrap">
            <h1>
                شركة أزادير
                <!-- 🎨 رسمة الشعار المستوحاة من 1000283088.jpg مع تحويل الرقم إلى 1 ووضعه على اليسار -->
                <svg class="logo-svg" viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
                    <!-- الدائرة الزرقاء وبداخلها رقم 1 بنفس درجة اللون -->
                    <circle cx="85" cy="100" r="62" fill="#20337a" />
                    <circle cx="85" cy="100" r="56" fill="none" stroke="#ffffff" stroke-width="2.5" />
                    <text x="85" y="126" font-family="'Segoe UI', Arial, sans-serif" font-size="82" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
                    
                    <!-- المبنى الأزرق الطولي -->
                    <polygon points="165,45 215,15 215,185 165,170" fill="#20337a" />
                    <!-- مربعات النوافذ الأربعة -->
                    <rect x="175" y="72" width="12" height="12" fill="#ffffff"/>
                    <rect x="193" y="72" width="12" height="12" fill="#ffffff"/>
                    <rect x="175" y="90" width="12" height="12" fill="#ffffff"/>
                    <rect x="193" y="90" width="12" height="12" fill="#ffffff"/>
                    
                    <!-- الجزء الأسود المنحني (حرف D) -->
                    <path d="M 220,15 C 265,15 320,45 320,100 C 320,155 265,185 220,185 L 220,150 C 255,150 282,130 282,100 C 282,70 255,50 220,50 Z" fill="#000000" />
                    
                    <!-- القوس السفلي الممتد -->
                    <path d="M 105,165 Q 185,215 310,185 Q 185,235 105,165" fill="#000000" />
                </svg>
            </h1>
        </div>
        <p>منظومة مشاركة الأسعار الذكية والفورية</p>
    </header>
    
    <div class="sync-box" id="admin-sync-box">
        <div class="sync-title">📢 لتحديث هواتف الموظفين بالأسعار الجديدة فوراً:</div>
        <button class="sync-btn btn-share" onclick="generateShareLink()">🔗 1. إنشاء رابط التحديث الفوري ونسخه للواتساب</button>
    </div>

    <div class="main-categories">
        <button class="cat-btn active" id="btn-pvc" onclick="switchCategory('pvc')">1. Pvc</button>
        <button class="cat-btn" id="btn-aluminium_ps" onclick="switchCategory('aluminium_ps')">2. ألومنيوم PS</button>
        <button class="cat-btn" id="btn-aluminium_hp" onclick="switchCategory('aluminium_hp')">3. ألومنيوم HP</button>
        <button class="cat-btn" id="btn-accessories_pvc" onclick="switchCategory('accessories_pvc')">4. اكسسوار PVC</button>
        <button class="cat-btn" id="btn-accessories_alum" onclick="switchCategory('accessories_alum')">5. اكسسوار ألومنيوم</button>
        <button class="cat-btn" id="btn-handrail" onclick="switchCategory('handrail')">6. درابزين</button>
        <button class="cat-btn" id="btn-gaskets" onclick="switchCategory('gaskets')">7. قومات</button>
        <button class="cat-btn" id="btn-carton" onclick="switchCategory('carton')">8. كارتن</button>
        <button class="cat-btn" id="btn-sheets" onclick="switchCategory('sheets')">9. الواح</button>
        <button class="cat-btn" id="btn-equipment" onclick="switchCategory('equipment')">10. معدات</button>
    </div>
    
    <h2 class="current-cat-title" id="category-title">القسم الحالي: 1. Pvc</h2>
    
    <div class="action-tabs" id="admin-action-tabs">
        <button class="action-btn active" id="tab-view-btn" onclick="switchAction('view')">البحث وعرض الأسعار</button>
        <button class="action-btn" id="tab-add-btn" onclick="switchAction('add')">إضافة منتج جديد</button>
        <button class="action-btn" id="tab-edit-btn" style="display:none; background:var(--edit-color); color:white;" onclick="switchAction('edit')">تعديل المنتج الحالي</button>
    </div>
    <div id="alert-msg" class="alert"></div>
    
    <div id="view-section" class="view-section active">
        <input type="text" id="search-input" style="margin-bottom:15px; width:100%; padding:10px; box-sizing:border-box;" placeholder="ابحث باسم المنتج في هذا القسم..." oninput="renderProducts()">
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>اسم المنتج</th>
                        <th>سعر الجملة</th>
                        <th>سعر البيع</th>
                        <th class="admin-actions" id="th-actions">إجراءات المسؤول</th>
                    </tr>
                </thead>
                <tbody id="products-table-body"></tbody>
            </table>
        </div>
    </div>
    
    <div id="add-section" class="form-section">
        <h3>إضافة منتج إلى قسم (<span id="insert-cat-name">1. Pvc</span>)</h3>
        <form id="add-product-form" onsubmit="addProduct(event)">
            <div class="form-group"><label>اسم المنتج:</label><input type="text" id="prod-name" required></div>
            <div class="form-group"><label>سعر الجملة:</label><input type="number" id="prod-wholesale" step="0.01" required></div>
            <div class="form-group"><label>سعر البيع:</label><input type="number" id="prod-retail" step="0.01" required></div>
            <button type="submit" class="btn">حفظ في هذا القسم</button>
        </form>
    </div>

    <div id="edit-section" class="form-section">
        <h3>تعديل بيانات المنتج</h3>
        <form id="edit-product-form" onsubmit="updateProduct(event)">
            <input type="hidden" id="edit-index">
            <div class="form-group"><label>اسم المنتج:</label><input type="text" id="edit-prod-name" required></div>
            <div class="form-group"><label>سعر الجملة الجديد:</label><input type="number" id="edit-prod-wholesale" step="0.01" required></div>
            <div class="form-group"><label>سعر البيع الجديد:</label><input type="number" id="edit-prod-retail" step="0.01" required></div>
            <button type="submit" class="btn" style="background-color: var(--edit-color);">تحديث وتعديل</button>
        </form>
    </div>

    <div class="admin-lock-zone">
        <span class="lock-link" id="admin-lock-btn" onclick="toggleAdminMode()">🔐 وضع المسؤول (تعديل وحذف)</span>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "2020"; 
    let isAdmin = false;

    let db = { pvc: [], aluminium_ps: [], aluminium_hp: [], accessories_pvc: [], accessories_alum: [], handrail: [], gaskets: [], carton: [], sheets: [], equipment: [] };
    
    const urlParams = new URLSearchParams(window.location.search);
    const sharedData = urlParams.get('update');
    
    if(sharedData) {
        try {
            const decodedData = JSON.parse(decodeURIComponent(escape(atob(sharedData))));
            if(decodedData && decodedData.pvc) {
                db = { ...db, ...decodedData };
                localStorage.setItem('azadeer_link_db', JSON.stringify(db));
                window.history.replaceState({}, document.title, window.location.pathname);
                alert('✅ مبروك! تم سحب وتحديث كامل قوائم الأسعار الجديدة بنجاح التام!');
            }
        } catch(e) {
            alert('حدث خطأ أثناء قراءة رابط التحديث الجاري.');
        }
    } else {
        let localData = localStorage.getItem('azadeer_link_db');
        if(localData) { 
            try { 
                let parsed = JSON.parse(localData); 
                db = { ...db, ...parsed };
            } catch(e){} 
        }
    }

    let currentCategory = 'pvc';
    const catNamesAr = { pvc: '1. Pvc', aluminium_ps: '2. ألومنيوم PS', aluminium_hp: '3. ألومنيوم HP', accessories_pvc: '4. اكسسوار PVC', accessories_alum: '5. اكسسوار ألومنيوم', handrail: '6. درابزين', gaskets: '7. قومات', carton: '8. كارتن', sheets: '9. الواح', equipment: '10. معدات' };
    
    function saveLocal() { localStorage.setItem('azadeer_link_db', JSON.stringify(db)); }
    
    function toggleAdminMode() {
        if (!isAdmin) {
            let pass = prompt("الرجاء إدخال الرقم السري للمسؤول لفتح الصلاحيات:");
            if (pass === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('admin-lock-btn').innerText = "🔓 تسجيل خروج من وضع المسؤول";
                document.getElementById('admin-sync-box').style.display = "block";
                document.getElementById('admin-action-tabs').style.display = "flex";
                document.getElementById('th-actions').style.display = "table-cell";
                renderProducts();
                showAlert("🔓 تم تفعيل صلاحيات المسؤول بنجاح بالرمز 2020!");
            } else if (pass !== null) {
                alert("❌ الرقم السري خاطئ! عرض فقط للموظفين.");
            }
        } else {
            isAdmin = false;
            document.getElementById('admin-lock-btn').innerText = "🔐 وضع المسؤول (تعديل وحذف)";
            document.getElementById('admin-sync-box').style.display = "none";
            document.getElementById('admin-action-tabs').style.display = "none";
            document.getElementById('th-actions').style.display = "none";
            switchAction('view');
            renderProducts();
            showAlert("🔒 تم تسجيل الخروج. العودة لوضع العرض الآمن للموظفين.");
        }
    }

    function generateShareLink() {
        if(!isAdmin) return alert('صلاحية منتهية');
        try {
            const jsonStr = JSON.stringify(db);
            const base64Str = btoa(unescape(encodeURIComponent(jsonStr)));
            const baseUrl = window.location.href.split('?')[0];
            const fullShareUrl = baseUrl + '?update=' + base64Str;
            navigator.clipboard.writeText(fullShareUrl).then(() => {
                showAlert('📋 تم نسخ رابط الموظفين الجديد بنجاح! أرسله لهم الآن عبر الواتساب.');
            }).catch(() => {
                prompt('انسخ هذا الرابط للموظفين:', fullShareUrl);
            });
        } catch(err) {
            alert('حجم المنتجات كبير جداً.');
        }
    }
    
    function switchCategory(catId) { 
        currentCategory = catId; 
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + catId).classList.add('active');
        document.getElementById('category-title').innerText = "القسم الحالي: " + catNamesAr[catId]; 
        document.getElementById('insert-cat-name').innerText = catNamesAr[catId]; 
        document.getElementById('tab-edit-btn').style.display = 'none';
        renderProducts(); 
    }
    
    function switchAction(type) { 
        document.querySelectorAll('.action-btn, .view-section, .form-section').forEach(el => el.classList.remove('active')); 
        if(type==='view'){ document.getElementById('tab-view-btn').classList.add('active'); document.getElementById('view-section').classList.add('active'); } 
        else if(type==='add'){ document.getElementById('tab-add-btn').classList.add('active'); document.getElementById('add-section').classList.add('active'); } 
        else if(type==='edit'){ document.getElementById('tab-edit-btn').classList.add('active'); document.getElementById('edit-section').classList.add('active'); }
    }
    
    function renderProducts() {
        const tbody = document.getElementById('products-table-body'); 
        if(!tbody) return;
        tbody.innerHTML = '';
        const searchTxt = document.getElementById('search-input').value.toLowerCase();
        const list = db[currentCategory] || [];
        
        list.forEach((prod, index) => {
            if(prod && prod.name && prod.name.toLowerCase().includes(searchTxt)) {
                let actionTd = isAdmin ? `<td class="admin-actions" style="display: table-cell;">
                    <div class="action-cell">
                        <button class="opt-btn btn-edit-item" onclick="setupEdit(${index})">تعديل</button>
                        <button class="opt-btn btn-del-item" onclick="deleteProduct(${index})">حذف</button>
                    </div>
                </td>` : '';

                tbody.innerHTML += `<tr>
                    <td><strong>${prod.name}</strong></td>
                    <td style="color:#2980b9; font-weight:bold;">${parseFloat(prod.wholesale).toFixed(2)} د.ل</td>
                    <td style="color:#27ae60; font-weight:bold;">${parseFloat(prod.retail).toFixed(2)} د.ل</td>
                    ${actionTd}
                </tr>`;
            }
        });
    }
    
    function addProduct(e) { e.preventDefault(); if(!isAdmin) return; if(!db[currentCategory]) db[currentCategory] = []; db[currentCategory].push({ name: document.getElementById('prod-name').value, wholesale: document.getElementById('prod-wholesale').value, retail: document.getElementById('prod-retail').value }); saveLocal(); renderProducts(); document.getElementById('add-product-form').reset(); showAlert('✅ تم حفظ المنتج! اضغط زر التحديث بالأعلى لنشره للموظفين.'); switchAction('view'); }

    function setupEdit(index) {
        if(!isAdmin) return;
        const prod = db[currentCategory][index];
        document.getElementById('edit-index').value = index;
        document.getElementById('edit-prod-name').value = prod.name;
        document.getElementById('edit-prod-wholesale').value = prod.wholesale;
        document.getElementById('edit-prod-retail').value = prod.retail;
        document.getElementById('tab-edit-btn').style.display = 'block';
        switchAction('edit');
    }

    function updateProduct(e) {
        e.preventDefault(); if(!isAdmin) return;
        const index = document.getElementById('edit-index').value;
        db[currentCategory][index] = { name: document.getElementById('edit-prod-name').value, wholesale: document.getElementById('edit-prod-wholesale').value, retail: document.getElementById('edit-prod-retail').value };
        saveLocal(); renderProducts(); document.getElementById('tab-edit-btn').style.display = 'none'; showAlert('⚙️ تم التعديل! يرجى إنشاء رابط التحديث لإرساله.'); switchAction('view');
    }

    function deleteProduct(index) { if(!isAdmin) return; if(confirm("هل أنت متأكد من الحذف؟")) { db[currentCategory].splice(index, 1); saveLocal(); renderProducts(); showAlert('🗑️ تم الحذف بنجاح.'); } }
    
    function showAlert(msg) { const box = document.getElementById('alert-msg'); if(!box) return; box.innerText = msg; box.style.display = 'block'; setTimeout(() => box.style.display = 'none', 6000); }
    window.onload = function() { renderProducts(); };
</script>
</body>
</html>
